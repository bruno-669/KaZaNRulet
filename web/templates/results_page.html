{{define "content"}}
<h2>Документ обработан и утверждён</h2>
{{$num := ""}}
{{range .Document.Fields}}
    {{if eq .Name "number"}}
        {{$num = .Value}}
    {{end}}
{{end}}
<h3>Документ №{{$num}}</h3>

<p>{{.Message}}</p>

<div>
    <a href="/export/{{.Document.ID}}/json" role="button">Скачать JSON</a>
    <a href="/export/{{.Document.ID}}/csv" role="button">Скачать CSV</a>
    <a href="/export/{{.Document.ID}}/xml" role="button">Скачать XML</a>
    <a href="/export/{{.Document.ID}}/xlsx" role="button">Скачать Excel (.xlsx)</a>
</div>

<br>
<a href="/">← Назад к списку</a>
{{end}}
